name: Deploy to GitHub Pages

# Builds the static site and publishes it. Triggered by a push to main, or by
# hand from the Actions tab.
#
# The build output is fully static (no server, no database): GitHub Pages just
# serves dist/. Routing is hash-based, so no 404-rewrite trick is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22+ can run the .ts test files directly (type stripping);
          # Node 20 cannot, which is why this must stay >= 22.
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npx tsc --noEmit
          node --test src/*.test.ts

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
